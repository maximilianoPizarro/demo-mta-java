# Copied into the MTA extension global storage on workspace start.
# scripts/devspaces-setup.sh rewrites baseURL to the live mta-llm Route on this cluster.
environment:
  ALLOW_INSECURE: "true"
models:
  cpu-qwen: &active
    environment:
      OPENAI_API_KEY: "mta-demo"
    provider: ChatOpenAI
    args:
      model: "bartowski/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M"
      configuration:
        baseURL: "https://mta-llm-mta-demo.PLACEHOLDER/v1"
active: *active
