# Tackle installs mta-deny-all, which blocks every ingress into the namespace.
# Knative's activator, autoscaler, and Kourier live outside mta-demo, so without
# this allow they can open a connection and then hang on /healthz.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}-knative
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: demo-mta-java
spec:
  podSelector:
    matchLabels:
      serving.knative.dev/service: {{ .Values.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: knative-serving
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: knative-serving-ingress
