# Wait Job as an Argo Sync hook (not a Helm hook). Pure Helm-hook charts look
# Synced/empty to Argo and never create CheCluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devspaces-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devspaces-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["org.eclipse.che"]
    resources: ["checlusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devspaces-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devspaces-bootstrap
subjects:
  - kind: ServiceAccount
    name: devspaces-bootstrap
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devspaces-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  bootstrap.sh: |
    #!/bin/bash
    set -euo pipefail
    echo "Waiting for CheCluster CRD..."
    for i in $(seq 1 90); do
      if oc get crd checlusters.org.eclipse.che >/dev/null 2>&1; then
        echo "CRD is present"
        break
      fi
      sleep 10
      if [ "$i" -eq 90 ]; then
        echo "Timed out waiting for the Dev Spaces operator"
        exit 1
      fi
    done
    echo "Waiting for Dev Spaces route..."
    for i in $(seq 1 60); do
      if oc get checluster {{ .Values.che.name }} -n {{ .Values.che.namespace }} >/dev/null 2>&1; then
        if oc get route -n {{ .Values.che.namespace }} --no-headers 2>/dev/null | grep -q .; then
          oc get route -n {{ .Values.che.namespace }}
          echo "Dev Spaces route is present"
          exit 0
        fi
        echo "CheCluster present; waiting for route (attempt $i)"
      else
        echo "CheCluster not applied yet (attempt $i)"
      fi
      sleep 15
    done
    echo "CheCluster applied; route not visible yet"
    oc get checluster -n {{ .Values.che.namespace }} -o yaml || true
    exit 0
---
apiVersion: batch/v1
kind: Job
metadata:
  name: devspaces-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  template:
    spec:
      serviceAccountName: devspaces-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image | quote }}
          command: ["/bin/bash", "/config/bootstrap.sh"]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: devspaces-bootstrap
            defaultMode: 0755
