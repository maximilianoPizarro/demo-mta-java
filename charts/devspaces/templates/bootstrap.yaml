apiVersion: v1
kind: ServiceAccount
metadata:
  name: devspaces-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devspaces-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["org.eclipse.che"]
    resources: ["checlusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devspaces-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devspaces-bootstrap
subjects:
  - kind: ServiceAccount
    name: devspaces-bootstrap
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devspaces-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  checluster.yaml: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: {{ .Values.che.namespace }}
    ---
    apiVersion: org.eclipse.che/v2
    kind: CheCluster
    metadata:
      name: {{ .Values.che.name }}
      namespace: {{ .Values.che.namespace }}
    spec:
      components: {}
      networking: {}
      devEnvironments:
        defaultNamespace:
          template: "<username>-devspaces"
        storage:
          pvcStrategy: per-user
  bootstrap.sh: |
    #!/bin/bash
    set -euo pipefail
    echo "Waiting for CheCluster CRD..."
    for i in $(seq 1 90); do
      if oc get crd checlusters.org.eclipse.che >/dev/null 2>&1; then
        echo "CRD is present"
        break
      fi
      sleep 10
      if [ "$i" -eq 90 ]; then
        echo "Timed out waiting for the Dev Spaces operator"
        exit 1
      fi
    done
    if oc get checluster {{ .Values.che.name }} -n {{ .Values.che.namespace }} >/dev/null 2>&1; then
      echo "CheCluster already exists"
    else
      oc apply -f /config/checluster.yaml
    fi
    echo "Waiting for Dev Spaces route..."
    for i in $(seq 1 60); do
      if oc get route -n {{ .Values.che.namespace }} --no-headers 2>/dev/null | grep -q .; then
        oc get route -n {{ .Values.che.namespace }}
        exit 0
      fi
      sleep 15
    done
    echo "CheCluster applied; route not visible yet"
    oc get checluster -n {{ .Values.che.namespace }} || true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: devspaces-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  template:
    spec:
      serviceAccountName: devspaces-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image | quote }}
          command: ["/bin/bash", "/config/bootstrap.sh"]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: devspaces-bootstrap
            defaultMode: 0755
