# Applied by Argo/Helm directly. Subscriptions come from values-hub; this chart
# only creates the CheCluster instance once the CRD exists.
apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: {{ .Values.che.name }}
  namespace: {{ .Values.che.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  components: {}
  networking: {}
  devEnvironments:
    defaultNamespace:
      template: "<username>-devspaces"
    storage:
      pvcStrategy: per-user
