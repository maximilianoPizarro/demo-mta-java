{{- if .Values.solutions.enabled }}
{{- range .Values.solutions.apps }}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ .name }}
  labels:
    {{- include "mta-demo.labels" $ | nindent 4 }}
    app: {{ .name }}
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ .name }}
  labels:
    {{- include "mta-demo.labels" $ | nindent 4 }}
    app: {{ .name }}
spec:
  {{- if $.Values.solutions.build.enabled }}
  source:
    type: Git
    git:
      uri: {{ $.Values.git.uri | quote }}
      ref: {{ $.Values.git.ref | quote }}
    contextDir: {{ .path | quote }}
  {{- else }}
  source:
    type: Binary
    binary: {}
  {{- end }}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: {{ $.Values.solutions.build.dockerfilePath | quote }}
  output:
    to:
      kind: ImageStreamTag
      name: {{ .name }}:latest
  {{- if $.Values.solutions.build.enabled }}
  triggers:
    - type: ConfigChange
  {{- end }}
  runPolicy: Serial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    {{- include "mta-demo.labels" $ | nindent 4 }}
    app: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
        {{- include "mta-demo.labels" $ | nindent 8 }}
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/{{ $.Release.Namespace }}/{{ .name }}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $.Values.solutions.port }}
          env:
            - name: PORT
              value: {{ $.Values.solutions.port | quote }}
            - name: APP_HEALTH_URL
              value: {{ printf "http://127.0.0.1:%v/health" $.Values.solutions.port | quote }}
            - name: MARKER_DIR
              value: /tmp/mta-demo
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.solutions.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    {{- include "mta-demo.labels" $ | nindent 4 }}
    app: {{ .name }}
spec:
  selector:
    app: {{ .name }}
  ports:
    - name: http
      port: {{ $.Values.solutions.port }}
      targetPort: http
{{- if $.Values.solutions.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .name }}
  labels:
    {{- include "mta-demo.labels" $ | nindent 4 }}
    app: {{ .name }}
spec:
  to:
    kind: Service
    name: {{ .name }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
{{- end }}
