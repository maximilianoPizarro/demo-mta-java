{{- $g := .Values.global | default dict }}
{{- $domain := coalesce .Values.clusterDomain (index $g "localClusterDomain") "" }}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mta-demo.fullname" . }}-userinfo
  labels:
    {{- include "mta-demo.labels" . | nindent 4 }}
    demo.redhat.com/userinfo: ""
    demo.redhat.com/application: demo-mta-java
data:
  demo_title: "MTA Java 8 to OpenJDK 11/17/21"
  access_instructions: |
    Open the Java 8 sample Route, then the three conversion Routes, the effort report, and MTA Hub (admin/admin).
    Dev Spaces: https://devspaces.{{ if $domain }}{{ $domain }}{{ else }}<cluster-apps-domain>{{ end }}/#{{ .Values.git.uri }}
  {{- if $domain }}
  java8_url: "https://{{ include "mta-demo.appName" . }}-{{ $ns }}.{{ $domain }}"
  java11_url: "https://mta-java-11-{{ $ns }}.{{ $domain }}"
  java17_url: "https://mta-java-17-{{ $ns }}.{{ $domain }}"
  java21_url: "https://mta-java-21-{{ $ns }}.{{ $domain }}"
  effort_report_url: "https://{{ .Values.reports.name }}-{{ $ns }}.{{ $domain }}"
  mta_hub_url: "https://mta-{{ $ns }}.{{ $domain }}"
  llm_url: "https://mta-llm-{{ $ns }}.{{ $domain }}/v1"
  devspaces_url: "https://devspaces.{{ $domain }}/#{{ .Values.git.uri }}"
  {{- else }}
  java8_url: "oc get route {{ include "mta-demo.appName" . }} -n {{ $ns }} -o jsonpath='{.spec.host}'"
  java11_url: "oc get route mta-java-11 -n {{ $ns }} -o jsonpath='{.spec.host}'"
  java17_url: "oc get route mta-java-17 -n {{ $ns }} -o jsonpath='{.spec.host}'"
  java21_url: "oc get route mta-java-21 -n {{ $ns }} -o jsonpath='{.spec.host}'"
  effort_report_url: "oc get route {{ .Values.reports.name }} -n {{ $ns }} -o jsonpath='{.spec.host}'"
  mta_hub_url: "oc get route mta -n {{ $ns }} -o jsonpath='{.spec.host}'"
  {{- end }}
  mta_hub_login: "admin / admin"
