# Wait Job as an Argo Sync hook (not a Helm hook). Pure Helm-hook charts look
# Synced/empty to Argo and never create KnativeServing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serverless-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: serverless-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operator.knative.dev"]
    resources: ["knativeservings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: serverless-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: serverless-bootstrap
subjects:
  - kind: ServiceAccount
    name: serverless-bootstrap
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: serverless-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  bootstrap.sh: |
    #!/bin/bash
    set -euo pipefail
    echo "Waiting for KnativeServing CRD..."
    for i in $(seq 1 90); do
      if oc get crd knativeservings.operator.knative.dev >/dev/null 2>&1; then
        echo "CRD is present"
        break
      fi
      sleep 10
      if [ "$i" -eq 90 ]; then
        echo "Timed out waiting for serverless-operator"
        exit 1
      fi
    done
    echo "Waiting for KnativeServing Ready..."
    for i in $(seq 1 120); do
      if oc get knativeserving knative-serving -n {{ .Values.serving.namespace }} >/dev/null 2>&1; then
        if oc wait --for=condition=Ready knativeserving/knative-serving -n {{ .Values.serving.namespace }} --timeout=30s 2>/dev/null; then
          oc get crd services.serving.knative.dev
          echo "OpenShift Serverless is ready"
          exit 0
        fi
      else
        echo "KnativeServing not applied yet (attempt $i)"
      fi
      sleep 10
    done
    echo "Timed out waiting for KnativeServing Ready"
    oc get knativeserving -n {{ .Values.serving.namespace }} -o yaml || true
    exit 1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: serverless-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  template:
    spec:
      serviceAccountName: serverless-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image | quote }}
          command: ["/bin/bash", "/config/bootstrap.sh"]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: serverless-bootstrap
            defaultMode: 0755
