schemaVersion: 2.2.0
metadata:
  name: demo-mta-java
  version: 1.0.0
  displayName: MTA Java Demo
  description: >
    Dev Spaces workspace for analyzing a synthetic Java 8 WebLogic-style app
    with MTA (OpenJDK 11/17/21 + cloud-readiness + custom BC4J rules).
  tags:
    - Java
    - MTA
    - OpenShift
  projectType: Java
attributes:
  # Che Code downloads these at startup. The "...-latest.vsix" names 404 on Open VSX.
  che-code.eclipse.org/vscode-extensions: '["https://open-vsx.org/api/redhat/java/linux-x64/1.57.2026092508/file/redhat.java-1.57.2026092508@linux-x64.vsix","https://open-vsx.org/api/vscjava/vscode-maven/0.45.3/file/vscjava.vscode-maven-0.45.3.vsix","https://open-vsx.org/api/redhat/mta-vscode-extension/8.2.1/file/redhat.mta-vscode-extension-8.2.1.vsix"]'
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: "200m"
      mountSources: true
      env:
        - name: VSCODE_TRUSTED_EXTENSIONS
          value: "redhat.java,vscjava.vscode-maven,redhat.mta-vscode-extension"
      endpoints:
        - name: http-app
          targetPort: 8080
          exposure: public
          protocol: http
commands:
  - id: build-sample
    exec:
      component: tools
      commandLine: bash scripts/with-java8.sh mvn -f sample-app/pom.xml -B package -DskipTests
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: build
        isDefault: true
  - id: run-sample
    exec:
      component: tools
      commandLine: bash scripts/with-java8.sh java -jar sample-app/target/mta-java-demo-1.0.0-SNAPSHOT.jar
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: run
        isDefault: true
  - id: install-mta-cli
    exec:
      component: tools
      commandLine: bash scripts/install-mta-cli.sh && export PATH="${PROJECT_SOURCE}/.tools/bin:$PATH" && mta-cli version || mta-cli --help | head -5
      workingDir: ${PROJECT_SOURCE}
      label: Install MTA CLI
  - id: analyze-openjdk11
    exec:
      component: tools
      commandLine: export PATH="${PROJECT_SOURCE}/.tools/bin:$PATH"; bash scripts/install-mta-cli.sh; bash scripts/mta-cli-analyze.sh openjdk11
      workingDir: ${PROJECT_SOURCE}
      label: MTA report OpenJDK 11
  - id: analyze-openjdk17
    exec:
      component: tools
      commandLine: export PATH="${PROJECT_SOURCE}/.tools/bin:$PATH"; bash scripts/install-mta-cli.sh; bash scripts/mta-cli-analyze.sh openjdk17
      workingDir: ${PROJECT_SOURCE}
      label: MTA report OpenJDK 17
  - id: analyze-openjdk21
    exec:
      component: tools
      commandLine: export PATH="${PROJECT_SOURCE}/.tools/bin:$PATH"; bash scripts/install-mta-cli.sh; bash scripts/mta-cli-analyze.sh openjdk21
      workingDir: ${PROJECT_SOURCE}
      label: MTA report OpenJDK 21
  - id: analyze-cloud-readiness
    exec:
      component: tools
      commandLine: export PATH="${PROJECT_SOURCE}/.tools/bin:$PATH"; bash scripts/install-mta-cli.sh; bash scripts/mta-cli-analyze.sh cloud-readiness
      workingDir: ${PROJECT_SOURCE}
      label: MTA report cloud-readiness
  - id: analyze-bc4j
    exec:
      component: tools
      commandLine: export PATH="${PROJECT_SOURCE}/.tools/bin:$PATH"; bash scripts/install-mta-cli.sh; bash scripts/mta-cli-analyze.sh bc4j
      workingDir: ${PROJECT_SOURCE}
      label: MTA report BC4J
  - id: analyze-all
    exec:
      component: tools
      commandLine: export PATH="${PROJECT_SOURCE}/.tools/bin:$PATH"; bash scripts/install-mta-cli.sh; bash scripts/mta-cli-analyze.sh all
      workingDir: ${PROJECT_SOURCE}
      label: MTA reports all targets
  - id: devspaces-setup
    exec:
      component: tools
      commandLine: bash scripts/devspaces-setup.sh
      workingDir: ${PROJECT_SOURCE}
events:
  postStart:
    - devspaces-setup
