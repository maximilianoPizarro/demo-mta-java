schemaVersion: 2.2.0
metadata:
  name: demo-mta-java
  version: 1.0.0
  displayName: MTA Java Demo
  description: >
    Dev Spaces workspace for analyzing a synthetic Java 8 WebLogic-style app
    with MTA (OpenJDK 11/17/21 + cloud-readiness + custom BC4J rules).
  tags:
    - Java
    - MTA
    - OpenShift
  projectType: Java
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 3Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: "200m"
      mountSources: true
      env:
        - name: VSCODE_TRUSTED_EXTENSIONS
          value: "redhat.java,vscjava.vscode-maven,redhat.mta-vscode-extension"
      endpoints:
        - name: http-app
          targetPort: 8080
          exposure: public
          protocol: http
commands:
  - id: build-sample
    exec:
      component: tools
      commandLine: bash scripts/with-java8.sh mvn -f sample-app/pom.xml -B package -DskipTests
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: build
        isDefault: true
  - id: run-sample
    exec:
      component: tools
      commandLine: bash scripts/with-java8.sh java -jar sample-app/target/mta-java-demo-1.0.0-SNAPSHOT.jar
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: run
        isDefault: true
  - id: devspaces-setup
    exec:
      component: tools
      commandLine: bash scripts/devspaces-setup.sh
      workingDir: ${PROJECT_SOURCE}
events:
  postStart:
    - devspaces-setup
