metadata:
  name: demo-mta-java
  displayName: "Demo MTA: esfuerzo Java 8 a 11/17/21 y aptitud a contenedores, sin cambiar WebLogic"
  description: >
    Demo sintética hub-only (CPU). Migration Toolkit for Applications mide el
    esfuerzo de Java 8 a OpenJDK 11/17/21 y la aptitud a contenedores.
    OpenShift Dev Spaces abre el repo; OpenShift Serverless escala un modelo
    llama.cpp desde cero para tool calling. WebLogic permanece como servidor
    de aplicaciones.
  support: community
  requiredResources:
    - kind: cpu
      quantity: "16"
    - kind: memory
      quantity: 64Gi
